version: "3.9"

# AUTOSAR HLD Document Analysis Assistant — Docker Compose
# Runs backend (FastAPI) and frontend (Streamlit) as separate,
# network-isolated containers sharing a persistent data volume.

services:

  # ---------------------------------------------
  # Backend — FastAPI REST API + RAG engine
  # ---------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autosar-hld-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/app/data
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-5-sonnet-20240620}"
      LOCAL_LLM_URL: "${LOCAL_LLM_URL:-http://host.docker.internal:11434/v1}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-llama3:8b}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-MiniLM-L6-v2}"
      DATA_DIR: "app/data"
      CHROMA_PERSIST_DIR: "app/data/chroma_db"
      SQLITE_DB_PATH: "app/data/autosar_analysis.db"
      UPLOAD_DIR: "app/data/uploads"
      ALLOWED_ORIGINS: "http://frontend:8501,http://localhost:8501,http://127.0.0.1:8501"
      AUTOSAR_API_KEY: "${AUTOSAR_API_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autosar-net

  # ---------------------------------------------
  # Frontend — Streamlit UI
  # ---------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autosar-hld-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://backend:8000"
      AUTOSAR_API_KEY: "${AUTOSAR_API_KEY:-}"
    networks:
      - autosar-net

volumes:
  appdata:
    driver: local

networks:
  autosar-net:
    driver: bridge
